server {
    listen 80;
    listen [::]:80;
    server_name localhost example.com www.example.com;

    gzip on;
    gzip_buffers 4 16k;
    gzip_comp_level 4; # 降低CPU压力
    gzip_min_length 10k; # 压缩更小的文件
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    access_log  /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    location /server/ {
        proxy_pass http://192.168.5.100:3000;

        # 操作日志需要记录「真实客户端 IP」而不是本机地址。
        # 注意：仅加这一行不会生效，后端还必须同时配置
        #   OPLOG_PROXY_HEADER=X-Forwarded-For
        #   OPLOG_TRUSTED_PROXIES=<本 nginx 所在网段，如 10.0.0.0/8>
        # 两项缺一不可（只配 header 不配白名单时后端会拒绝启用，防止客户端伪造 IP）。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
